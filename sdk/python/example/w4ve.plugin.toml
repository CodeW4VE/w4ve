# The reference plugin. Everything a real one needs is in here once, so this
# file is worth copying rather than a "hello world" that teaches nothing.

[plugin]
id       = "greeter"
name     = "Greeter"
version  = "1.0.0"
protocol = 1

[run]
# The interpreter is part of the command on purpose: a plugin with its own
# virtualenv points at that python here, and nothing else has to know.
command = ["python3", "main.py"]

# What this plugin needs installed. Declared and checked, never installed by
# W4VE: fetching code from the internet and running it is your decision, not a
# side effect of starting a server. Checked against the interpreter in
# `run.command`, so a virtualenv is asked rather than whatever runs w4ve.
[python]
requires = []

# A ceiling on what this plugin may take. Off unless you ask for it, because a
# default limit is one somebody hits at the worst moment without having chosen
# it. It is a ceiling and NOT a sandbox: it stops a plugin eating the machine
# by accident, and does nothing about one that means harm.
#
# [limits]
# memory = "256M"
# cpu    = 300      # seconds of CPU time
# files  = 128      # open file descriptors

[config]
# Whatever is here arrives as `plugin.config`. Edit it and reload the plugin.
greeting = "welcome back"
# Who is allowed to be greeted loudly. Empty means everybody.
vips = []
